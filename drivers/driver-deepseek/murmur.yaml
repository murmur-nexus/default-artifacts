name: driver-deepseek
version: 0.15.0
runtime: driver
description: "DeepSeek inference driver — deepseek-flash and deepseek-v4-pro with thinking mode"
requires_files:
  - driver_deepseek.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
upstream_auth:
  header: Authorization
  value: "Bearer {key}"

# The limits of each model this driver serves, from the provider's documentation; README.md cites each number.
models:
  deepseek-flash:
    max_output_tokens: 393216
    context_window: 1048576
  deepseek-v4-pro:
    max_output_tokens: 393216
    context_window: 1048576
