[package]
name = "murmur-tool-report"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true
murmur-time = { path = "../../libs/murmur-time" }

# Host-target-only. Used solely by tests/wasm_component.rs to instantiate the compiled
# wasm32-wasip2 component with two preopens (workdir at `.`, durable state at `state`)
# and prove the report file is written under the state grant and nowhere else. Never a
# build-time dependency of the wasm target itself — a `[dev-dependencies]` entry is
# excluded from the cdylib the component is built from.
[dev-dependencies]
wasmtime = "46"
wasmtime-wasi = "46"
