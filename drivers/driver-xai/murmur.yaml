name: driver-xai
version: 0.1.0
runtime: driver
description: "xAI inference driver — grok-4.7, grok-4.6 and grok-build-0.1 on the Responses API, stateless with response storage off and each turn's encrypted reasoning sent back, with reasoning_effort and response_format config keys"
requires_files:
  - driver_xai.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
upstream_auth:
  header: Authorization
  value: "Bearer {key}"

# The limits of each model this driver serves; src/lib.rs's SUPPORTED_MODELS holds the same numbers.
models:
  grok-4.7:
    max_output_tokens: 128000
    context_window: 500000
  grok-4.6:
    max_output_tokens: 128000
    context_window: 500000
  grok-build-0.1:
    max_output_tokens: 128000
    context_window: 256000
