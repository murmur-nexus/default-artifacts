name: driver-anthropic
version: 0.20.0
runtime: driver
description: |
  Anthropic Messages API inference driver for Murmur agent capsules. Translates the Murmur
  canonical inference format to and from the Messages API, including SSE streaming, extended
  thinking and model-family handling.

  It places `cache_control` breakpoints on the tool inventory, the system prompt and the end of
  the settled conversation, so a prefix is cached across turns. Caching is on by default; the
  `config:` block on this driver's entry in the capsule's manifest tunes it, and reaches this
  artifact alone as `MURMUR_ARTIFACT_CONFIG`. `prompt_cache` accepts `enabled`/`disabled` or a
  bool and defaults to enabled; `prompt_cache_ttl` accepts `5m`/`1h` and defaults to `5m`. Any
  other value falls back to the default, and neither key errors or warns.

      artifacts:
        - name: murmur/driver-anthropic
          runtime: driver
          config:
            prompt_cache: enabled
            prompt_cache_ttl: 1h

  It sizes every image in a request to the model's resolution tier before sending it, places a
  tool's image inside the `tool_result` that answers the call, and reports what it sent in the
  response's `images` list. A tool declaring `provider_tool: {kind: computer}`, such as
  `murmur/tool-computer`, goes to Claude as Anthropic's own computer tool on every model in the
  README's "Computer use" table, with Claude's coordinates scaled back to the tool's display.

  Caching lives on the artifact rather than on `inference.driver.config` because a
  `cache_control` breakpoint is an Anthropic construct — the other drivers have nowhere to put
  one. Extended thinking, `anthropic-beta` features and passthrough `params` are still read from
  `inference.driver.config`.
requires_files:
  - driver_anthropic.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
upstream_auth:
  header: x-api-key
  value: "{key}"

# The limits of each model this driver serves, from the provider's documentation; README.md cites each number.
# `vision` is whether the model reads images; README.md's "Images" table cites each one.
