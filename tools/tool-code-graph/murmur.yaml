name: tool-code-graph
version: 0.7.0
runtime: tool
implementation: wasm
description: |
  Indexes a Rust and/or Python repository into a SQLite-backed symbol/edge graph
  and answers structured queries over it. Symbols are addressed by a stable
  identity that survives unrelated edits elsewhere in the repo (not by
  `file:line`), one scheme per language:
    - Rust:   `rust://<package>/<module>#<qualified-name>(<signature>)`
    - Python: `python://<package>/<module>#<qualified-name>(<params>)`
  e.g. `rust://mycrate/graph#Foo::bar(&self,usize)->bool` and
  `python://mypkg/pkg.core#Widget::doubled(self->int)`. A single index pass walks
  both `*.rs` and `*.py` files, dispatching each to the parser matching its
  extension, so pure-Rust, pure-Python, and mixed repos all index in one call.
  The graph is stored at `<repo_path>/.murmur/code-graph.db`; re-indexing an
  unchanged repo is a fast no-op via per-file content-hash comparison. Python
  attribute-qualified calls (`x.foo()`) are conservatively classified as method
  calls (never `definite` confidence), since Python cannot statically distinguish
  a module-qualified free call from a dynamic dispatch.

  | op               | inputs                                        | outputs                                              |
  |------------------|-----------------------------------------------|------------------------------------------------------|
  | index_repository | repo_path                                     | changed_files, unchanged_files, removed_files,       |
  |                  |                                               | total_symbols, total_edges                           |
  | find_symbol      | repo_path, query, limit?                      | count, matches:[{symbol_id,qualified_name,kind,      |
  |                  |                                               | signature,module,file,start_line,doc_comment}]       |
  | get_symbol       | repo_path, symbol_id                          | full symbol detail + callees:[] + callers:[]         |
  | slice_symbol     | repo_path, symbol_id, max_depth?, max_nodes?, | root, node_count, edge_count, truncated,             |
  |                  | direction?                                    | nodes:[{symbol_id,qualified_name,depth}], data_path  |
  | explain_path     | repo_path, from, to, max_depth?               | found:bool, depth, path:[symbol_id]                  |
  | impact_analysis  | repo_path, file, start_line, end_line,        | roots, callers, tests, routes,                       |
  |                  | max_depth?, max_nodes?                         | persistence_operations, public_apis, truncated,      |
  |                  |                                               | data_path (each node: {symbol_id,qualified_name,     |
  |                  |                                               | kind,file,start_line,depth,confidence})              |

  Defaults: limit=20, max_depth=3 (slice / impact_analysis) / 6 (explain_path),
  max_nodes=50 (slice / impact_analysis), direction="callees" (use "callers" to
  walk the reverse call graph).
  Every result has status (passed|failed|error), summary and data.
  repo_path is relative to the work folder ('.', the default, is the work folder
  itself) or absolute inside a host folder the session opened; index_repository
  needs it writable. Reported paths name the repository as the call wrote it.
  A file under no Cargo.toml [package] or Python project name takes the last
  segment of repo_path as its package, or crate (Rust) / package (Python) when
  repo_path is '.'.
  find_symbol returns an empty match list (not an error) when nothing matches;
  explain_path reports "no path found within depth N" as a passed result;
  impact_analysis returns an empty (passed) result when the line range overlaps
  no symbol, but fails when `file` was never indexed.
  impact_analysis resolves the edited line range to the symbol(s) it overlaps,
  walks the reverse call graph (calls edges only), and classifies every touched
  symbol into tests / routes / persistence_operations / public_apis. The first
  three are best-effort name/attribute heuristics; public_apis is bare `pub`.
  Each node's `confidence` (definite|possible|heuristic) is the weakest signal
  among the call edges used to reach it (method calls and ambiguous names are
  never definite at Level 1 — no type inference).

requires_files:
  - tool_code_graph.wasm

input_schema:
  type: object
  properties:
    operation:
      type: string
      enum:
        - index_repository
        - find_symbol
        - get_symbol
        - slice_symbol
        - explain_path
        - impact_analysis
      description: "Operation to perform."
    repo_path:
      type: string
      description: "Path to the repository root, relative to the work folder ('.' for the work folder itself, the default) or absolute inside a host folder the session opened. index_repository needs it writable."
    query:
      type: string
      description: "Required for find_symbol. FTS5 search string matched (prefix, ranked) against qualified_name and doc_comment."
    limit:
      type: integer
      description: "Optional for find_symbol. Maximum matches to return. Default 20, clamped to [1,500]."
    symbol_id:
      type: string
      description: "Required for get_symbol and slice_symbol. The stable symbol identity, e.g. rust://mycrate/graph#Foo::bar(&self,usize)->bool or python://mypkg/pkg.core#Widget::doubled(self->int)."
    max_depth:
      type: integer
      description: "Optional for slice_symbol and impact_analysis (default 3) and explain_path (default 6). Bounds traversal depth; the depth bound is the termination guarantee for cyclic graphs."
    max_nodes:
      type: integer
      description: "Optional for slice_symbol and impact_analysis. Caps the number of nodes returned; the result's truncated flag is set when the cap is hit. Default 50."
    direction:
      type: string
      enum:
        - callees
        - callers
      description: "Optional for slice_symbol. 'callees' (default) walks outgoing call edges; 'callers' walks the reverse call graph."
    from:
      type: string
      description: "Required for explain_path. Source symbol_id."
    to:
      type: string
      description: "Required for explain_path. Target symbol_id."
    file:
      type: string
      description: "Required for impact_analysis. The edited file, repo-relative ('\\' becomes '/', a leading ./ is dropped). An absolute file loses an absolute repo_path prefix; under a relative repo_path it matches the longest indexed path it ends with, whole segments only."
    start_line:
      type: integer
      description: "Required for impact_analysis. 1-based first line of the edited range; symbols overlapping [start_line, end_line] are the impact roots."
    end_line:
      type: integer
      description: "Required for impact_analysis. 1-based last line of the edited range; must be >= start_line."
  required:
    - operation

capabilities:
  filesystem:
    # Documents what the tool works on; the runtime does not read this block. A
    # WASM tool's grants come only from its entry in the capsule's artifacts:;
    # copy this block onto that entry to narrow the tool to the work folder. The
    # tool reads Rust and Python sources under repo_path and writes its graph db
    # and slice/impact payloads under repo_path/.murmur, so the work folder (or
    # a host folder) holding repo_path must be read-write for index_repository.
    allow:
      - "."
