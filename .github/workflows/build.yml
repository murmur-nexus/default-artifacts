name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-publish (e.g. v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # The murmur commit `mur` is built from, to pack and index the release. Always a literal
  # SHA: `mur build` decides the zip bytes and `mur index` the index bytes, so a floating
  # murmur could change either between two runs over one commit, and the bytes gate would
  # then refuse a republish that changed nothing here. Move it deliberately, in its own
  # commit, and only to a murmur whose `mur install` reads what this one writes.
  MURMUR_REV: 6750b5f9824d40db80b825569064a891781419f1

# Publish a GitHub Release for every version tag: every artifact packed by `mur build`,
# and the schema 2 artifacts-index.json `mur install murmur/<name>@<version>` reads from
# the latest release.
#
# No artifact is named here. scripts/list-artifacts.sh enumerates them from their own
# murmur.yaml files.
#
# Pipeline:
#   1. verify   — the tag is the workspace version and the newest v* tag, and no
#                 artifact changed its payload at an unchanged version.
#   2. release  — builds the wasm artifacts, packs everything, indexes it against the
#                 previous release's index, installs every new version through a
#                 real `mur`, and only then uploads.

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: refuse a tag that would publish the wrong thing
  # ---------------------------------------------------------------------------
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # Full history and tags: the newest-tag check and check-version-drift.sh
          # below both read every v* tag.
          fetch-depth: 0

      - name: Check the tag is the workspace version
        run: |
          version=$(awk '
            /^\[workspace\.package\]/ { inside = 1; next }
            /^\[/                     { inside = 0 }
            inside && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG is not v + [workspace.package] version ($version) in Cargo.toml"
            exit 1
          fi
          echo "Tag $TAG matches [workspace.package] version $version."

      # `mur install` reads the index of the latest release only, and the release job
      # marks this one latest. Republishing an older tag would replace the newest index
      # with one that lacks every version released since.
      - name: Check the tag is the newest release tag
        run: |
          newest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ "$TAG" != "$newest" ]; then
            echo "::error::$TAG is not the newest v* tag ($newest); only the newest tag may publish, because its index becomes the one every install reads"
            exit 1
          fi

      # A version that ships bytes differing from the ones already published under it
      # cannot be corrected afterwards: consumers pin the payload's sha256 in
      # murmur.lock, and a store that already holds <name>/<version> never
      # re-downloads it. ci.yml runs this on every PR; here it guards the tag itself.
      # The release job's bytes gate checks the built zips against the published
      # index too; this one names the input that moved.
      - name: Check no artifact changed its payload at an unchanged version
        run: ./scripts/check-version-drift.sh

      - name: List the artifacts to publish
        run: ./scripts/list-artifacts.sh

  # ---------------------------------------------------------------------------
  # Step 2: pack, index, prove and publish
  # ---------------------------------------------------------------------------
  # Every step before the upload must pass, so a release whose index breaks a
  # published version's bytes, or whose new versions do not install, uploads nothing.
  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MUR_BIN: ${{ github.workspace }}/murmur/target/debug/mur
    steps:
      # Both repositories nest under $GITHUB_WORKSPACE: actions/checkout rejects a path
      # that escapes it, so this is the sibling layout that passes its validation.
      - name: Check out default-artifacts
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: default-artifacts

      - name: Check out murmur at MURMUR_REV
        uses: actions/checkout@v4
        with:
          repository: murmur-nexus/murmur
          ref: ${{ env.MURMUR_REV }}
          path: murmur

      - name: Install libseccomp
        # murmur-cli links against it. Bounded separately from the job: a runner whose
        # Azure mirror is unreachable leaves `apt-get update` failing over for tens of
        # minutes.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      - name: Install murmur's pinned toolchain
        working-directory: murmur
        run: rustup show

      - name: Build mur
        # Debug, not release: packing and indexing are cheap, so the compile is what costs.
        working-directory: murmur
        run: |
          cargo build -p murmur-cli
          "$MUR_BIN" version

      # Pinned toolchain (source of truth: rust-toolchain.toml). Keep the
      # `toolchain:` input in sync with that file's `channel`.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            default-artifacts
            murmur

      # Pinned wasm-tools for component validation below.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.247.0

      - name: Build wasm artifacts
        working-directory: default-artifacts
        run: bash scripts/build-wasm.sh --locked

      # Every built component against its category's expected world, at the exact
      # interface version the vendored WIT declares. A malformed or mis-bound
      # component fails the release here instead of shipping.
      - name: Validate components
        working-directory: default-artifacts
        run: bash scripts/validate-component.sh

      # The latest release's index carries every version published so far; the new
      # index merges it, and the bytes gate holds every version in both to the same
      # assets. Three outcomes:
      #   - no release exists yet, or the latest one has no artifacts-index.json (true
      #     once, for the first release after the rename): index without --previous,
      #     and say which;
      #   - the asset exists: it is the previous index;
      #   - any other gh failure fails the job, rather than publishing an index that
      #     silently drops every earlier version.
      - name: Fetch the previous index
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets 2> gh-error.txt); then
            if grep -q 'release not found' gh-error.txt; then
              echo "::notice::$GITHUB_REPOSITORY has no release yet; indexing $TAG without a previous index"
              exit 0
            fi
            cat gh-error.txt >&2
            exit 1
          fi
          latest_tag=$(jq -r '.tagName' <<< "$latest")
          if ! jq -e '.assets | any(.name == "artifacts-index.json")' <<< "$latest" > /dev/null; then
            echo "::notice::the latest release $latest_tag has no artifacts-index.json; indexing $TAG without a previous index"
            exit 0
          fi
          gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --pattern artifacts-index.json --dir previous
          echo "Previous index: artifacts-index.json from $latest_tag"
          echo "path=$GITHUB_WORKSPACE/previous/artifacts-index.json" >> "$GITHUB_OUTPUT"

      # Packs only the versions this release adds: a <name>@<version> the previous index
      # lists stays on the release that published it, and the index carries its entry
      # forward. Repacking it with a newer mur would change its bytes (the packed
      # built_at_level moves whenever murmur adds a WIT level) and fail the bytes gate.
      - name: Pack the versions this release adds
        working-directory: default-artifacts
        env:
          PREVIOUS: ${{ steps.previous.outputs.path }}
        run: ./scripts/package-release.sh "$GITHUB_WORKSPACE/release" ${PREVIOUS:+--previous "$PREVIOUS"}

      - name: Index the release and apply the bytes gate
        working-directory: default-artifacts
        env:
          PREVIOUS: ${{ steps.previous.outputs.path }}
        run: ./scripts/index-release.sh "$GITHUB_WORKSPACE/release" --release "$TAG" ${PREVIOUS:+--previous "$PREVIOUS"}

      - name: Install every new version through mur
        working-directory: default-artifacts
        run: ./scripts/check-release-installs.sh "$GITHUB_WORKSPACE/release" --release "$TAG"

      - name: List release assets
        run: ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
