[package]
name = "driver-openai"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true
murmur-driver-env = { path = "../../libs/murmur-driver-env" }
murmur-driver-stream = { path = "../../libs/murmur-driver-stream" }

# tempfile gives tests/mur_run_tool_call_limit.rs scratch directories. A
# `[dev-dependencies]` entry is excluded from the cdylib the component is built from.
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"
