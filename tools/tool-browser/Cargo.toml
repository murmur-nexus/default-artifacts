[package]
name = "tool-browser"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Every registry dependency below is already in Cargo.lock at the version named, so this crate
# moves no version: a new or moved version would change every wasm artifact's
# bytes. The WebSocket client in src/ws.rs is hand-written for the same reason.
[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true
murmur-process-host = { path = "../../libs/murmur-process-host" }
sha1 = "0.10"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"

# Host-target-only. murmur-process-test-host runs the compiled wasm32-wasip2 component in
# tests/common, with a test host for `murmur:process` that starts the real browser; tempfile
# gives every suite its scratch folders. A `[dev-dependencies]` entry never reaches the cdylib.
[dev-dependencies]
murmur-process-test-host = { path = "../../libs/murmur-process-test-host" }
tempfile = "3"
