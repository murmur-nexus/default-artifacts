name: tool-editor
version: 0.12.0
runtime: tool
implementation: wasm
description: |
  Reads, writes, edits and searches files. A call holds exactly one of read, write, edit or find. Paths are relative to the work folder; an absolute path is refused.
  read returns content and total_lines: at most 2000 lines and 100 KB, with longer lines cut to 2000 characters. A cut read adds start_line, end_line and a truncated note naming the limit and the start_line that continues it. An explicit range over 2000 lines is refused.
  write creates or replaces the file and any missing directories.
  edit applies edits in order, each to the result of the one before; each old must match exactly once. All or nothing: if one fails, the file is unchanged and the error names its position, from 1.
  find searches file contents for a regex, skipping hidden directories, target, node_modules and binary files. It stops at the first limit reached (200 matches, 5000 files walked, 32 MiB read, 500 KB result) and returns the matches so far with a capped note naming it. Match paths are relative to dir.
input_schema:
  type: object
  properties:
    read:
      type: object
      properties:
        path:
          type: string
        start_line:
          type: integer
          description: 1-based, default 1
        end_line:
          type: integer
          description: 1-based, inclusive
      required: [path]
    write:
      type: object
      properties:
        path:
          type: string
          format: murmur-destination
        content:
          type: string
      required: [path, content]
    edit:
      type: object
      properties:
        path:
          type: string
          format: murmur-destination
        edits:
          type: array
          items:
            type: object
            properties:
              old:
                type: string
              new:
                type: string
            required: [old, new]
      required: [path, edits]
    find:
      type: object
      properties:
        pattern:
          type: string
        dir:
          type: string
          description: default the work folder
        glob:
          type: string
          description: "*.py matches names at any depth; src/**/*.rs matches paths under dir"
        recursive:
          type: boolean
          description: default true
        context_lines:
          type: integer
          description: 0-20, default 0
      required: [pattern]
requires_files:
  - tool_editor.wasm
