name: tool-code-coverage
version: 0.7.0
runtime: tool
implementation: wasm
description: |
  Spectrum-based fault localization (Ochiai / Tarantula) over a Rust repository
  already indexed by tool-code-graph. Input is a directory of per-test
  LCOV `.info` coverage reports the agent already produced via its own
  `cargo llvm-cov --lcov` shell calls (this tool never runs tests or coverage
  itself) plus the list of failing test names. For every indexed symbol whose
  line range overlaps a covered line, it computes ef/ep (failing/passing tests
  touching it) and derives Ochiai and Tarantula suspicion, writing all four onto
  code-graph's existing `symbols` table (columns suspicion_ef, suspicion_ep,
  suspicion_ochiai, suspicion_tarantula) so static reachability and dynamic
  suspicion are queryable in one SELECT. MVP language scope is Rust only.

  | op       | inputs                                        | outputs                                              |
  |----------|-----------------------------------------------|------------------------------------------------------|
  | localize | repo_path?, coverage_dir, failing_tests,      | failing_test_count, passing_test_count,              |
  |          | limit?                                         | scored_symbols, truncated, top_suspects:[{symbol_id, |
  |          |                                               | qualified_name,kind,file,start_line,ef,ep,           |
  |          |                                               | suspicion_ochiai,suspicion_tarantula}],              |
  |          |                                               | failing_test_stable_ids, failing_tests_without_      |
  |          |                                               | coverage, skipped_files, data_path                   |

  Defaults: limit=50 (clamped to [1,10000]); repo_path defaults to the work
  folder ('.'). The db at <repo_path>/.murmur/code-graph.db must already
  exist (run tool-code-graph index_repository first) — this tool never
  creates it. Ochiai = ef/sqrt(F*(ef+ep)) (0 when ef==0); Tarantula =
  (ef/F)/((ef/F)+(ep/P)) with the ep/P term 0 when P==0. Symbols no coverage
  touched stay NULL in all four columns (distinct from a computed 0). Every
  localize run first resets all four columns repo-wide. A failing test with no
  matching <name>.info is listed in failing_tests_without_coverage; an
  unparseable .info is listed in skipped_files; both are non-fatal unless zero
  failing coverage remains (F==0), which fails. A failing test's own symbol
  trivially self-covers (ef>=1) — expected SBFL behavior, not filtered.
  Absolute LCOV SF: paths are matched to indexed files through the repository
  prefix they share; relative SF: paths are relative to repo_path. The db must
  use the default rollback journal (tool-code-graph's default); a WAL-mode db
  cannot be opened.
  Every result has status (passed|failed|error), summary and data.

requires_files:
  - tool_code_coverage.wasm

input_schema:
  type: object
  properties:
    operation:
      type: string
      enum:
        - localize
      description: "Operation to perform. Only 'localize' is supported."
    repo_path:
      type: string
      description: "Optional. Path to the repository root containing .murmur/code-graph.db, relative to the work folder ('.' for the work folder itself, the default) or absolute inside a host folder the session opened read-write. This tool never creates the db — it must already exist (run tool-code-graph index_repository first)."
    coverage_dir:
      type: string
      description: "Required. Directory of per-test LCOV `.info` files (one per test, e.g. produced by `cargo llvm-cov --lcov --output-path <dir>/<test>.info -- --exact <test>`). Relative to the work folder, or absolute inside a host folder the session opened. Each file's stem is its test name; files whose stem is not in failing_tests are treated as passing tests."
    failing_tests:
      type: array
      items:
        type: string
      description: "Required, non-empty. Names of the tests that failed (matching the `.info` file stems in coverage_dir). Each also gets a best-effort stable_id resolved against the code graph."
    limit:
      type: integer
      description: "Optional. Maximum suspects to return inline in top_suspects. Default 50, clamped to [1,10000]. When the scored-symbol count exceeds it, truncated is true and the full sorted list is written to data_path."
  required:
    - operation
    - coverage_dir
    - failing_tests

capabilities:
  filesystem:
    # Documents what the tool works on. murmur reads a WASM tool's grants from
    # the capsule's entry for it, not from this block. The tool needs the work
    # folder, or a host_paths folder (read-write for repo_path), holding
    # repo_path and coverage_dir: it reads the LCOV files under coverage_dir,
    # reads and writes the code graph db under repo_path/.murmur, and writes
    # its full-suspects payload under repo_path/.murmur/coverage. Copying this
    # block onto the capsule entry narrows the tool to it.
    allow:
      - "."
