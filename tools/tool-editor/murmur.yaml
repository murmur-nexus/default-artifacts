name: tool-editor
version: 0.10.0
runtime: tool
implementation: wasm
description: |
  Structured file editing interface for Murmur capsules. Provides read, write,
  surgical patch, and search operations without requiring shell capability grants.

  | op              | inputs                                             | outputs                                                  |
  |-----------------|----------------------------------------------------|----------------------------------------------------------|
  | read_file       | path, start_line?, end_line?                       | content, total_lines, start_line?, end_line?, truncated? |
  | write_file      | dest_path, content                                 | (file created/updated)                                   |
  | replace_in_file | dest_path, old_string, new_string                  | count: N replacements                                    |
  | find_in_files   | pattern, dir?, glob?, recursive?, context_lines?   | matches: [{path, line, text}], capped?: string           |

  read_file start_line/end_line are 1-based inclusive; both optional. A read returns at
  most 2000 lines and at most 100 KB (102,400 bytes) of content, and a line longer than
  2000 characters is cut to its first 2000 characters. A read with no range starts at
  line 1; a file within all three limits comes back verbatim as content, plus
  total_lines. Otherwise read_file returns the lines that fit joined with "\n",
  total_lines, the resolved start_line and end_line, and a truncated note when a limit
  cut the read. The note names the limit and, when the read stopped before the
  requested lines ran out, the start_line that continues the read. An omitted end_line
  reads to end of file or to the first limit reached. An explicit span over 2000 lines,
  a start_line below 1 or past the end of the file, or an inverted range errors; an
  end_line past the end clamps to the file's line count. read_file returns the
  requested content on every successful call, including a repeat read of an unchanged
  file, and writes nothing.

  find_in_files context_lines (default 0, like `grep -C`, max 20) attaches
  context_before/context_after arrays to each match; 0 omits those keys entirely.

  find_in_files searches the whole workdir when dir is omitted, "" or ".". Below the
  directory it searches, it skips hidden directories (names starting with ".", such as
  .git and .venv), target and node_modules, and it skips binary files (a NUL byte in the
  first 8 KiB, or not UTF-8); a dir that names a skipped directory searches it. glob
  filters which files are read: a glob without "/", such as *.py, matches the file name
  at any depth; one with "/", such as src/**/*.rs, matches the path relative to dir.
  Files the glob excludes are never read, but they count toward the limit of files
  walked. A search stops at the first limit it reaches: 200 matches, 5000 files walked,
  32 MiB read, or a 500 KB result. A search that reaches a limit still succeeds: it returns the matches
  found so far plus a capped note naming the limit. Each match's path is relative to dir.
  A dir whose ".." climbs above the workdir returns error_kind outside_workdir.

  The two writing operations take their destination as dest_path; read_file and
  find_in_files take path and dir. dest_path is the only input this tool declares as a
  write destination, so a capsule's filesystem read_only grant is enforced against that
  declaration rather than against the spelling of a property name.

  All responses: {ok:bool, message:string, error_kind?:string}
  Paths are relative to the capsule workdir (the binary's CWD at dispatch time). An
  absolute value on path, dest_path, dir or glob is refused rather than resolved: it returns
  error_kind absolute_path naming the offending value and the relative form to send, and
  the operation touches no file. Send 'results.txt', not '/app/results.txt'.

input_schema:
  type: object
  properties:
    operation:
      type: string
      enum:
        - read_file
        - write_file
        - replace_in_file
        - find_in_files
      description: "Operation to perform."
    path:
      type: string
      description: "File path to read, relative to capsule workdir; an absolute value is refused. Required for read_file."
    dest_path:
      type: string
      format: murmur-destination
      description: "File path this call writes to, relative to capsule workdir; an absolute value is refused. Required for write_file and replace_in_file."
    content:
      type: string
      description: "File content to write. Required for write_file."
    old_string:
      type: string
      description: "Literal string to search for. Required for replace_in_file."
    new_string:
      type: string
      description: "Replacement string. Required for replace_in_file."
    pattern:
      type: string
      description: "Regex pattern to search for. Required for find_in_files."
    dir:
      type: string
      description: "Directory to search, relative to the capsule workdir. Optional; omitted, \"\" or \".\" searches the whole workdir. An absolute value is refused."
    glob:
      type: string
      description: "Filters which files find_in_files opens; the files it excludes still count toward the limit of files walked. Optional. *.py matches a file name at any depth; a pattern containing /, such as src/**/*.rs, matches the path relative to dir. An absolute value is refused."
    recursive:
      type: boolean
      description: "Whether to search recursively. Optional for find_in_files. Defaults to true."
    start_line:
      type: integer
      description: "1-based inclusive first line to read. Optional for read_file. Omit to read from line 1."
    end_line:
      type: integer
      description: "1-based inclusive last line to read. Optional for read_file. Omitted, the read runs to end of file or to the first limit reached (2000 lines, 100 KB). Clamps to the file's line count. An explicit span over 2000 lines errors."
    context_lines:
      type: integer
      description: "Lines of context around each match (like grep -C). Optional for find_in_files. Defaults to 0 (no context); max 20."
  required:
    - operation

requires_files:
  - tool_editor.wasm
