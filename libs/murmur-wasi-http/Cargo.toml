[package]
name = "murmur-wasi-http"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Internal-only shared library: the one request-body writer every artifact that sends a
# `wasi:http` body uses. It exists so those artifacts cannot drift apart again — each once
# wrote its whole body before dispatching the request, and hung once the body outgrew the
# host's bounded body buffer. Compiles only for wasm32: on any other target the crate is
# empty. NOT an artifact: it has no murmur.yaml, so nothing publishes it.

[lib]
name = "murmur_wasi_http"
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"
