name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Release on tag push is handled by build.yml.
# This workflow runs tests and version verification on every push and PR.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain. rust-toolchain.toml is the source of truth; this
      # `toolchain:` input pre-installs/caches the matching version and adds the
      # wasm target. Keep it in sync with rust-toolchain.toml's `channel`.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip2
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2

      # Pinned wasm-tools for component validation (see "Validate built components").
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.247.0

      # Every artifact is a <category>/<name>/murmur.yaml, and that manifest is the
      # only place its name and version are written. The script refuses a directory
      # not named after its artifact, a `murmur-` prefix, a missing name or version,
      # and an unknown `implementation:` — the same enumeration the release packs from.
      - name: List artifacts
        run: ./scripts/list-artifacts.sh

      # The workspace is rustfmt-clean with no rustfmt.toml, and stays that way. This
      # runs before the tests so a formatting failure is reported without waiting on them.
      # rustfmt comes from the toolchain step's `components:`, not from
      # rust-toolchain.toml, which is a payload input of every compiled artifact.
      - name: Cargo fmt
        run: cargo fmt --all -- --check

      # --locked: a Cargo.lock that no longer matches the workspace (a member renamed,
      # added, or its version changed without `cargo update --workspace --offline`)
      # fails here instead of being rewritten in place and passing.
      - name: Cargo test
        run: cargo test --workspace --locked

      # Native tools (`implementation: native` in their murmur.yaml) are excluded:
      # they are host binaries, not components, and their C dependencies
      # (libsqlite3-sys, tree-sitter) do not cross-compile to wasm32-wasip2.
      #
      # The script derives that exclusion set from the manifests rather than
      # repeating it here, so "build everything that targets wasm" has one
      # definition a developer can run locally, and the release runs the same one.
      - name: Cargo build (wasm)
        run: bash scripts/build-wasm.sh

      # Every built .wasm must be a well-formed component whose world-level
      # imports/exports match its category (hooks export murmur:hook/lifecycle
      # with no murmur:* import; drivers/tools export murmur:tool/run and import
      # only murmur:stream/events and/or murmur:task/task), at the exact interface
      # version the vendored WIT declares — a component built against a stale WIT
      # is unloadable by the host. Native command components
      # (tool-{git,git-validate,registry-search}) are skipped by name.
      # A malformed or mis-bound component fails here instead of at `mur run`.
      #
      # Invoked bare, the script walks target/wasm32-wasip2/release/ itself, so
      # "validate everything" has one definition a developer can run locally.
      - name: Validate built components
        run: bash scripts/validate-component.sh

  # Hold every artifact to the rule that a change to what it ships moves the
  # `version:` in its murmur.yaml. A `.mur.zip` is served by name and version alone
  # and `mur install` pins its sha256 in the consumer's murmur.lock, so
  # re-publishing different bytes at a version someone already resolved does not
  # reach them — it fails their next resolve on the pin. There is no way to
  # correct that after the tag is pushed, which is why this runs on every PR.
  #
  # Needs the full history: the check compares HEAD against the last v* tag.
  version-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check no artifact changed its payload at an unchanged version
        run: ./scripts/check-version-drift.sh

  # Verify the artifact-facing WIT trees (wit/guest, wit/hook, wit/process-driver) stay
  # byte-identical to murmur/crates/capsule-runtime/wit at the one murmur commit this repo pins:
  # MURMUR_REV in build.yml, the commit the release builds `mur` from. build.yml keeps it a literal
  # SHA, so an unrelated murmur merge cannot turn this job red. The mirror and the pin move
  # together, in one commit, with `./scripts/murmur-pin.sh --set <commit>`; moving one without the
  # other is what turns this job red.
  #
  # Both repos are checked out into sibling subdirectories of $GITHUB_WORKSPACE
  # (default-artifacts/, murmur/). check-wit-sync.sh looks for murmur in the directory
  # beside the main checkout, which here is $GITHUB_WORKSPACE/murmur.
  # (actions/checkout rejects a path that escapes $GITHUB_WORKSPACE, so murmur
  # cannot be checked out to `../murmur`; nesting both under the workspace is the
  # equivalent sibling layout that passes that validation.)
  wit-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default-artifacts
        uses: actions/checkout@v4
        with:
          path: default-artifacts

      # murmur-pin.sh fails on no `  MURMUR_REV: <40-hex SHA>` line in build.yml, or on more
      # than one. `rev=` on its own line, so that failure fails the step.
      - name: Read MURMUR_REV from build.yml
        id: murmur-rev
        working-directory: default-artifacts
        run: |
          rev=$(./scripts/murmur-pin.sh)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "$rev"

      - name: Check out murmur at build.yml's MURMUR_REV as a sibling directory
        uses: actions/checkout@v4
        with:
          repository: murmur-nexus/murmur
          ref: ${{ steps.murmur-rev.outputs.rev }}
          path: murmur

      - name: Check artifact-facing WIT files are in sync with murmur
        working-directory: default-artifacts
        run: ./scripts/check-wit-sync.sh

  # Hold every artifact version a README, skill or BUILD.md copies to the `version:` in that
  # artifact's murmur.yaml. Copies are written by hand and a bump leaves them behind: three
  # reviews in a row found stale ones, each telling a reader to install a version other than
  # the one documented beside it.
  readme-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every doc pin matches its artifact's murmur.yaml version
        run: ./scripts/check-readme-pins.sh

  # Prove that every compiled artifact (wasm and native) packs the same bytes built
  # alone as it does in the release build. A crate's bytes can depend on which other
  # crates share its cargo invocation (feature unification), so an artifact rebuilt
  # alone could ship different bytes at the same version; check-build-isolation.sh
  # runs the release's builds, rebuilds each artifact by itself, and fails on any
  # zip that differs.
  #
  # Packing needs the `mur` the release packs with, so this job builds it the way
  # build.yml's release job does. MURMUR_REV is read out of build.yml by
  # ./scripts/murmur-pin.sh rather than written here, so the release and this check
  # cannot pin two different murmurs: moving the pin means editing build.yml only.
  build-isolation:
    runs-on: ubuntu-latest
    env:
      # Outside every target directory rust-cache restores: on a cache key that is not a
      # full match (any change to either Cargo.lock), rust-cache pre-cleans each listed
      # workspace's target/debug down to build/, .fingerprint/ and deps/, which would
      # delete a mur left in murmur/target/debug.
      MUR_BIN: ${{ github.workspace }}/bin/mur
    steps:
      # Both repositories nest under $GITHUB_WORKSPACE: actions/checkout rejects a path
      # that escapes it, so this is the sibling layout that passes its validation.
      - name: Check out default-artifacts
        uses: actions/checkout@v4
        with:
          path: default-artifacts

      # murmur-pin.sh fails on no `  MURMUR_REV: <40-hex SHA>` line under build.yml's
      # top-level `env:`, or on more than one, rather than building some other mur.
      # `rev=` on its own line, so that failure fails the step.
      - name: Read MURMUR_REV from build.yml
        id: murmur-rev
        working-directory: default-artifacts
        run: |
          rev=$(./scripts/murmur-pin.sh)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "$rev"

      - name: Check out murmur at build.yml's MURMUR_REV
        uses: actions/checkout@v4
        with:
          repository: murmur-nexus/murmur
          ref: ${{ steps.murmur-rev.outputs.rev }}
          path: murmur

      # This step through the cache step mirror build.yml's release job in order: mur
      # is built before this repo's toolchain step, so it compiles with the same
      # toolchain the release builds it with.
      - name: Install libseccomp
        # murmur-cli links against it. Bounded separately from the job: a runner whose
        # Azure mirror is unreachable leaves `apt-get update` failing over for tens of
        # minutes.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      - name: Install murmur's pinned toolchain
        working-directory: murmur
        run: rustup show

      - name: Build mur
        # Debug, not release: packing is cheap, so the compile is what costs.
        working-directory: murmur
        run: |
          cargo build -p murmur-cli
          install -D target/debug/mur "$MUR_BIN"
          "$MUR_BIN" version

      # Pinned toolchain. rust-toolchain.toml is the source of truth; this
      # `toolchain:` input pre-installs/caches the matching version and adds the
      # wasm target. Keep it in sync with rust-toolchain.toml's `channel`.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-isolation
          workspaces: |
            default-artifacts
            murmur

      - name: Check every artifact packs the same bytes alone as in the release build
        working-directory: default-artifacts
        run: ./scripts/check-build-isolation.sh
