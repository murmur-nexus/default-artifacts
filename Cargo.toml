[workspace]
members = [
  "drivers/driver-anthropic",
  "drivers/driver-claude-code",
  "drivers/driver-deepseek",
  "drivers/driver-moonshotai",
  "drivers/driver-openai",
  "drivers/driver-zai",
  "hooks/hook-compact",
  "hooks/hook-debug",
  "hooks/hook-diff-summary",
  "hooks/hook-eval",
  "hooks/hook-grafana",
  "hooks/hook-memory",
  "hooks/hook-regression-verifier",
  "hooks/hook-shell-desc",
  "libs/murmur-driver-env",
  "libs/murmur-driver-stream",
  "libs/murmur-hook-transcript",
  "libs/murmur-test-parse",
  "libs/murmur-time",
  "tools/tool-corpus",
  "tools/tool-create",
  "tools/tool-editor",
  "tools/tool-code-coverage",
  "tools/tool-code-graph",
  "tools/tool-git",
  "tools/tool-test-report",
  "tools/tool-registry-search",
  "tools/tool-report",
  "tools/tool-request-input",
  "tools/tool-tavily",
  "tools/tool-git/validate",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.28.0"
license = "Apache-2.0"
# MSRV. At or below the toolchain pinned in rust-toolchain.toml (currently 1.95.0).
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.59"
# Native-only dependencies for tool-code-graph. These pull in C sources
# (SQLite via `bundled`, and tree-sitter's C runtime + grammar), which do not
# cross-compile to wasm32-wasip2 — hence the tool is native, like tool-git.
rusqlite = { version = "0.31", features = ["bundled"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
sha2 = "0.10"
