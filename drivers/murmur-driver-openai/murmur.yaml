name: murmur-driver-openai
version: 0.4.0
runtime: driver
description: OpenAI inference driver for Murmur agent capsules — Chat Completions, with Responses API for gpt-5 and later models. Reads store, thinking, reasoning_effort and verbosity from inference.driver.config and rejects any other key; store grants server-side retention and with it stateful continuation via previous_response_id.
requires_files:
  - murmur_driver_openai.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
inference_auth:
  header: Authorization
  value: "Bearer {key}"
