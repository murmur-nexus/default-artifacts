name: tool-browser
version: 0.5.0
runtime: tool
implementation: wasm
description: |
  Drives a headless Chrome or Chromium, one action per call. The first call starts the browser; it stays until close or the session's end.
  Calls run one at a time; two sent together run in no set order, so send the next after the last answers.
  open url (http, https, file, about:blank, or a work-folder path) returns the page as text: `page: <title> — <url>`, then an indented accessibility tree, one `- role "name" [states] [ref=eN]` per node. Pass a ref to act on that node.
  click/type/press/select/wait/back answer with what changed (`changed: +A -R lines`, then `+`/`-` lines) or the new page.
  snapshot (ref for one part), console and network (new errors and failed requests since the last look), screenshot (PNG; full_page or ref), close.
  Read the text first; take a screenshot only to check layout.
  Needs chromium, chromium-browser, google-chrome or chrome in capabilities.shell.allow. Writes .tool-browser/<id>/ in the work folder.

requires_files:
  - tool_browser.wasm

input_schema:
  type: object
  properties:
    action:
      type: string
      enum:
        - open
        - snapshot
        - click
        - type
        - press
        - select
        - wait
        - back
        - console
        - network
        - screenshot
        - close
    url:
      type: string
      description: "open: the URL or work-folder path."
    ref:
      type: string
      description: "A ref from the last snapshot, e.g. e3. Needed by click, type, select; optional for snapshot, wait, screenshot."
    text:
      type: string
      description: "type: text to insert. wait: text to wait for."
    key:
      type: string
      description: "press: Enter, Tab, Escape, Backspace, Delete, Space, ArrowUp/Down/Left/Right, Home, End, PageUp, PageDown or one character; may start with Control+, Shift+, Alt+ or Meta+."
    value:
      type: string
      description: "select: the option's value or visible label."
    submit:
      type: boolean
      description: "type: press Enter after."
    full_page:
      type: boolean
      description: "screenshot: the whole page, not the 1280x800 viewport."
    ms:
      type: integer
      description: "wait: timeout for text or ref, or the sleep alone (default 10000, max 60000)."
  required:
    - action

programs:
  # What Chrome needs from the host, by name, never by host path: mur grants it read-only to the
  # granted name when the capsule pins tool-browser with `mur install` (an operator lock origin).
  # packages: names the Ubuntu 24.04 package mur doctor suggests when a need is missing. The
  # linked libraries from libnss3.so on are in the browser's own DT_NEEDED closure, which mur
  # grants anyway; they are listed so that mur doctor names the package when one is missing.
  # chromium's download: pins Chrome for Testing's chrome-headless-shell per platform, fetched by
  # `mur install` into ~/.murmur/programs/<sha256>/ and run only when no chromium is on PATH; its
  # needs then resolve against that copy. README.md says how to move the build.
  chromium:
    needs: &chrome-needs
      - program_folder: .
      - library: libsoftokn3.so
        packages: { ubuntu: libnss3 }
      - file: libsoftokn3.chk
        beside: libsoftokn3.so
      - library: libfreebl3.so
        packages: { ubuntu: libnss3 }
      - file: libfreebl3.chk
        beside: libfreebl3.so
      - library: libfreeblpriv3.so
        packages: { ubuntu: libnss3 }
      - file: libfreeblpriv3.chk
        beside: libfreeblpriv3.so
      - library: libnssdbm3.so
        packages: { ubuntu: libnss3 }
      - file: libnssdbm3.chk
        beside: libnssdbm3.so
      - library: libnssckbi.so
        packages: { ubuntu: libnss3 }
      - library: libnss3.so
        packages: { ubuntu: libnss3 }
      - library: libnssutil3.so
        packages: { ubuntu: libnss3 }
      - library: libnspr4.so
        packages: { ubuntu: libnspr4 }
      - library: libatk-1.0.so.0
        packages: { ubuntu: libatk1.0-0t64 }
      - library: libatk-bridge-2.0.so.0
        packages: { ubuntu: libatk-bridge2.0-0t64 }
      - library: libatspi.so.0
        packages: { ubuntu: libatspi2.0-0t64 }
      - library: libXcomposite.so.1
        packages: { ubuntu: libxcomposite1 }
      - library: libXdamage.so.1
        packages: { ubuntu: libxdamage1 }
      - library: libXfixes.so.3
        packages: { ubuntu: libxfixes3 }
      - library: libXrandr.so.2
        packages: { ubuntu: libxrandr2 }
      - library: libgbm.so.1
        packages: { ubuntu: libgbm1 }
      - library: libasound.so.2
        packages: { ubuntu: libasound2t64 }
      - system: fonts
        packages: { ubuntu: fonts-liberation }
      - etc: fonts/fonts.conf
        packages: { ubuntu: fontconfig }
    download:
      linux-x86_64:
        url: https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/linux64/chrome-headless-shell-linux64.zip
        sha256: deafffa74660b34853a4119c361fd427ac8c9fcb62db51ddb8a797cd83a4ba2d
        run: chrome-headless-shell-linux64/chrome-headless-shell
      linux-aarch64:
        url: https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/linux-arm64/chrome-headless-shell-linux-arm64.zip
        sha256: b9b910a57b2a15eb3e55000a2339f93a973934a413ebfc6e585a50ec6c42fd6c
        run: chrome-headless-shell-linux-arm64/chrome-headless-shell
      darwin-aarch64:
        url: https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/mac-arm64/chrome-headless-shell-mac-arm64.zip
        sha256: e6a6b13551aa12f951d0891d79282606b13742837c8fa0505e1272bae116ce82
        run: chrome-headless-shell-mac-arm64/chrome-headless-shell
  chromium-browser:
    needs: *chrome-needs
  google-chrome:
    needs: *chrome-needs
  chrome:
    needs: *chrome-needs

capabilities:
  # Documentary: the runtime does not read this block. The capsule must grant any ONE of these
  # in its own capabilities.shell.allow, because murmur:process refuses a program it does not
  # list and the tool finds its grant through the manifest murmur stages for each shell.allow
  # entry. programs: above carries what Chrome needs from the host for each name, and
  # programs.chromium.download pins the chrome-headless-shell that `mur install` fetches; a
  # chromium on the host's PATH runs instead of it. The README lists the capabilities.resources
  # values Chrome needs.
  shell:
    allow:
      - chromium
      - chromium-browser
      - google-chrome
      - chrome
