[package]
name = "murmur-tool-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

# Host-target-only. Used solely by tests/wasm_component.rs to instantiate the compiled
# wasm32-wasip2 component with two preopens (workdir at `.`, durable state at `state`)
# and prove the store survives independent instantiations. Never a build-time dependency
# of the wasm target itself — a `[dev-dependencies]` entry is excluded from the cdylib
# the component is built from.
[dev-dependencies]
wasmtime = "46"
wasmtime-wasi = "46"
# Used by tests/mur_run_state.rs, which stages a scratch HOME holding a whole artifact
# registry and a capsule store per launch. Its neighbours hand-roll a directory under
# std::env::temp_dir() and leave it behind, which is affordable for the few small files
# they write and not for the tens of megabytes a staged launch leaves.
tempfile = "3"
