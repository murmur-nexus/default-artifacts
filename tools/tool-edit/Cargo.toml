[package]
name = "tool-edit"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only this tool's operation: the component links none of the other three tools' code.
murmur-file-tools = { path = "../../libs/murmur-file-tools", default-features = false, features = ["edit"] }
wit-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"
