name: tool-registry-search
version: 0.4.0
runtime: tool
implementation: native
description: |
  Search a Murmur artifact index (schema 2) for artifacts matching a keyword.

  Each result is a full `<scope>/<name>`, such as `murmur/tool-editor`, with every version the
  index publishes, newest first. Each version comes with the release that holds it, the WIT level
  it was built at, and the platforms its payloads cover (`any` for a platform-independent
  payload).

  The results list what is published, not what will load in this capsule. `mur` decides fit at
  install time. `mur install <scope>/<name>`, or the `pull-artifact` tool when this capsule may
  pull artifacts, installs the newest version that fits the running `mur`. An explicit version
  that does not fit is refused, naming the one that does. So pass `<scope>/<name>` without a
  version.

  By default it searches the index on the latest default-artifacts release.

requires_files:
  - bin/tool-registry-search

input_schema:
  type: object
  properties:
    query:
      type: string
      description: "Search keyword, matched case-insensitively against the full `<scope>/<name>`, the bare name, the description and the tags."
    index:
      type: string
      description: "A URL (`http://`/`https://`), or a path to an `artifacts-index.json` file, relative to the working directory or absolute. Omit for the index on the latest default-artifacts release."
    limit:
      type: integer
      description: "Maximum number of results to return. Default: 10."
  required:
    - query

# Documents what the tool reaches; the runtime does not read this block. A
# native tool runs in the capsule's own sandbox under the capsule-wide
# capabilities, so the capsule must list these hosts in its own
# capabilities.network.allow.
capabilities:
  network:
    allow:
      - "https://github.com"
      - "https://release-assets.githubusercontent.com"
