name: driver-openai
version: 0.16.0
runtime: driver
description: OpenAI inference driver for Murmur agent capsules — routes each listed OpenAI model to the Responses or Chat Completions endpoint its model page lists, and refuses any other model. Reads store, thinking, reasoning_effort and verbosity from inference.driver.config and rejects any other key; store grants server-side retention and with it stateful continuation via previous_response_id.
requires_files:
  - driver_openai.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
upstream_auth:
  header: Authorization
  value: "Bearer {key}"

# The limits of each model this driver serves, from the provider's documentation, including any input ceiling it gives below the window; README.md cites each number.
models:
  gpt-6-astra:
    max_output_tokens: 128000
    context_window: 1050000
    max_input_tokens: 922000
  gpt-6.1-sol:
    max_output_tokens: 128000
    context_window: 1050000
    max_input_tokens: 922000
  gpt-6-luna:
    max_output_tokens: 128000
    context_window: 1050000
    max_input_tokens: 922000
  gpt-5.6-cyber:
    max_output_tokens: 128000
    context_window: 400000
    max_input_tokens: 272000
  gpt-oss-120b:
    max_output_tokens: 131072
    context_window: 131072
  gpt-oss-20b:
    max_output_tokens: 131072
    context_window: 131072
  gpt-6-sol:
