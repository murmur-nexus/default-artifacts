[package]
name = "driver-anthropic"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true
murmur-driver-computer = { path = "../../libs/murmur-driver-computer" }
murmur-driver-env = { path = "../../libs/murmur-driver-env" }
murmur-driver-image = { path = "../../libs/murmur-driver-image" }
murmur-driver-stream = { path = "../../libs/murmur-driver-stream" }
murmur-wasi-http = { path = "../../libs/murmur-wasi-http" }

# tempfile gives the `mur_run_*` tests scratch directories, serde_norway parses murmur.yaml in a
# test, as murmur does, and murmur-driver-image's `fixtures` feature supplies the test images. A
# `[dev-dependencies]` entry is excluded from the cdylib the component is built from.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
murmur-driver-image = { path = "../../libs/murmur-driver-image", features = ["fixtures"] }
serde_norway = "0.9.42"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"
