[package]
name = "tool-huggingface"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
sha2.workspace = true
wit-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"

# Host-target-only. wasmtime, wasmtime-wasi and wasmtime-wasi-http are used solely by
# tests/wasm_component.rs to instantiate the compiled wasm32-wasip2 component with
# `wasi:http/outgoing-handler` linked, so its requests reach loopback fakes for real.
# tempfile gives the host tests and tests/mur_run_gateway.rs scratch directories. Never a
# build-time dependency of the wasm target itself.
[dev-dependencies]
wasmtime = "46"
wasmtime-wasi = "46"
wasmtime-wasi-http = "46"
tempfile = "3"
