[package]
name = "murmur-host-roots"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Internal-only shared library: where a path input of a wasm32-wasip2 tool opens — in the
# work folder, inside a host folder the runtime preopened as `murmur-host…`, or nowhere.
# Dependency-free and target-independent, so any tool component can link it without pulling
# in anything else, and its rules are unit-tested on the host. NOT an artifact: it has no
# murmur.yaml, so nothing publishes it.
#
# This crate is the one place those rules live: libs/murmur-file-tools (tool-read, tool-write,
# tool-edit, tool-find) and tool-test-report both resolve through it.

[dependencies]
