name: murmur-hook-memory
version: 0.7.0
runtime: hook
binding: on-task-start
execution_mode: blocking
commit_policy: seed-context
description: "Seeds a task with the relevant part of the conversation that came before it — pages the runtime's durable conversation record read-only, selects a budget-bounded chronological slice, and stamps each seeded message with the record message it came from."
requires_files:
  - murmur_hook_memory.wasm
