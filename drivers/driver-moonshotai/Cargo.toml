[package]
name = "driver-moonshotai"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true
murmur-driver-env = { path = "../../libs/murmur-driver-env" }
murmur-driver-stream = { path = "../../libs/murmur-driver-stream" }
murmur-wasi-http = { path = "../../libs/murmur-wasi-http" }

# tempfile gives tests/mur_run_large_body.rs scratch directories, and serde_norway parses
# murmur.yaml in a test, as murmur does. A `[dev-dependencies]` entry is excluded from the cdylib
# the component is built from.
[dev-dependencies]
serde_norway = "0.9.42"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"
