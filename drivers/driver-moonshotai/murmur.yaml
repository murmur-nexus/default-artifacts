name: driver-moonshotai
version: 0.13.0
runtime: driver
description: "Moonshot AI inference driver — kimi-k3 on the Chat Completions surface, with reasoning_effort and response_format config keys"
requires_files:
  - driver_moonshotai.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
upstream_auth:
  header: Authorization
  value: "Bearer {key}"

# The limits of each model this driver serves; src/lib.rs's SUPPORTED_MODELS holds the same numbers.
models:
  kimi-k3:
    max_output_tokens: 1048576
    context_window: 1048576
