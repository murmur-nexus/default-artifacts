name: driver-claude-code
version: 0.11.0
runtime: driver
description: |
  Process driver for Claude Code. It tells a `transport: process` capsule how to drive the
  `claude` CLI: the argument list for one turn, the JSON line the task goes out on, the MCP
  config that points the harness at the capsule's tool bridge, and the control request that
  interrupts a turn.

  Unlike an HTTP driver, it holds no credential and makes no request — the harness authenticates
  itself, which is the point of process transport: a turn spends a Claude subscription rather
  than an API key. The driver is granted nothing at all: no network, no filesystem, no
  environment.

  The capsule must allow the variables the harness cannot run without:

      inference:
        transport: process
        driver:
          artifact: murmur/driver-claude-code
      capabilities:
        env:
          allow: [HOME, PATH]

  It also reads the harness's stdout back into the runtime's events: streamed text and thinking,
  tool calls and their results, retries, and a turn that ended or failed. A failing turn is read
  from `is_error` and `api_error_status`, never from `subtype` alone — Claude Code reports an
  authentication or quota failure as `subtype: success`. It also reports a tool call as soon as
  the model starts writing it, and how many bytes of its input are written so far — never the
  input itself.

  The driver also reports the input, output, cache-read, cache-creation and thinking token
  counts Claude Code prints for a turn. These are the harness's own reported numbers for a
  subscription turn rather than anything Murmur metered, and are read only off the `result` line
  that ends a turn: the running count Claude Code prints on `message_delta` counts one message,
  not the turn. A count the harness did not report stays absent rather than being reported as
  zero. The counts go out as totals for the harness run, which is what the interface asks for,
  so a second turn is reported as the sum of itself and every turn before it.

  On a subscription login, `claude` prints a rate limit line, and each one becomes exactly one
  `quota` event. It carries the five-hour window (`five-hour`, 300 minutes), the seven-day window
  (`seven-day`, 10080 minutes), any other window type `claude` names under its own name with `_`
  written as `-`, and overage as an `overage` window. Each window carries the fraction used
  (capped at 1), its reset time in milliseconds and its state (`ok`, `warning` or `exhausted`),
  each only when the line carries it.

  Setting `prompt_suggestions: true` under `inference.driver.config` starts `claude` with
  `--prompt-suggestions true`. Each suggested next prompt it prints after a turn's result then
  becomes a `suggested-prompt` event. Each suggestion costs one more model call on the
  subscription, and murmur reads it only within its exit grace after the turn. Suggestions are
  off by default. Any other key, or a `prompt_suggestions` that is not a JSON boolean, refuses
  the turn with a message naming it.

  An image in a tool result is reported in the feed as `[image: <media type>, <n> bytes]`, never
  as its bytes; whether the model saw it is up to `claude`.

  Run it as a normal user: as root, `claude` refuses the permission mode the driver starts it
  in, so every turn fails, and the error says so.
requires_files:
  - driver_claude_code.wasm
