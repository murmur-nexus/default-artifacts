[package]
name = "murmur-driver-stream"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Internal-only shared library: the limit on how many slots one turn's stream may name, and
# the only code that grows a driver's slot table from an index the provider sent. It exists
# so every driver refuses an out-of-range index the same way instead of allocating whatever
# the stream asks for. Depends on nothing but `std`, so it cross-compiles to wasm32-wasip2
# cleanly. NOT an artifact: it has no murmur.yaml, so nothing publishes it.

[lib]
name = "murmur_driver_stream"
path = "src/lib.rs"
