name: murmur-driver-deepseek
version: 0.4.0
runtime: driver
description: "DeepSeek inference driver — deepseek-v4-flash and deepseek-v4-pro with thinking mode"
requires_files:
  - murmur_driver_deepseek.wasm

# How this provider expects the inference credential to be presented; the runtime substitutes {key}.
upstream_auth:
  header: Authorization
  value: "Bearer {key}"
