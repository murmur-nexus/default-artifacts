[package]
name = "tool-test-report"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
# Reads code-graph's per-project database for `stable_id`. Its `bundled` feature compiles
# SQLite's C sources into the component with the pinned wasi-sdk (wasi-sdk.toml), which
# .cargo/config.toml names as the wasm32-wasip2 C compiler; no system SQLite is linked.
rusqlite.workspace = true
# Binds the murmur:tool/run@0.2.0 export (world `tool`) in the wasm32 module.
wit-bindgen.workspace = true
# Shared parsers (detect_format/parse_cargo/parse_pytest/parse_go/parse_jest),
# extracted so hook-regression-verifier can reuse them at the source level.
murmur-test-parse = { path = "../../libs/murmur-test-parse" }
# Where `input_path` and `repo_path` open: in the work folder, or inside a host folder the
# runtime preopened as `murmur-host…`.
murmur-host-roots = { path = "../../libs/murmur-host-roots" }
# `NativeOutcome`: the result envelope reduced to what murmur's native dispatch handed the
# model, as the 0.5.0 tool's stdout was. Root items only: no file-tool feature.
murmur-file-tools = { path = "../../libs/murmur-file-tools", default-features = false }

# The WASI preopens and their descriptor flags, from which the component builds its host
# roots. Only the component reads them; the host-testable core takes the roots as a value.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"

[dev-dependencies]
# tests/test_report_integration.rs and tests/wasm_component.rs instantiate the compiled
# component in Wasmtime with the scratch work folder at `.` and host folders at
# `murmur-host<path>`, as murmur opens them.
wasmtime = "46"
wasmtime-wasi = "46"
# Builds code-graph fixture databases on the host, in tool-code-graph's schema, and turns
# one into WAL mode.
rusqlite.workspace = true
# Parses the component's `data` and the recorded native fixture.
serde_json.workspace = true
