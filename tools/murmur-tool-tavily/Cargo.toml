[package]
name = "murmur-tool-tavily"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"

# Host-target-only. wasmtime, wasmtime-wasi and wasmtime-wasi-http are used solely by
# tests/wasm_component.rs to instantiate the compiled wasm32-wasip2 component with
# `wasi:http/outgoing-handler` linked, so its one POST reaches a loopback fake Tavily for
# real. tempfile gives the host tests and tests/mur_run_gateway.rs scratch directories.
# Never a build-time dependency of the wasm target itself — a `[dev-dependencies]` entry
# is excluded from the cdylib the component is built from.
[dev-dependencies]
wasmtime = "46"
wasmtime-wasi = "46"
wasmtime-wasi-http = "46"
tempfile = "3"
