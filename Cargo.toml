[workspace]
members = [
  "drivers/driver-anthropic",
  "drivers/driver-baseten",
  "drivers/driver-claude-code",
  "drivers/driver-deepseek",
  "drivers/driver-moonshotai",
  "drivers/driver-openai",
  "drivers/driver-zai",
  "hooks/hook-command-guard",
  "hooks/hook-compact",
  "hooks/hook-debug",
  "hooks/hook-diff-summary",
  "hooks/hook-eval",
  "hooks/hook-grafana",
  "hooks/hook-memory",
  "hooks/hook-regression-verifier",
  "hooks/hook-shell-desc",
  "libs/murmur-driver-computer",
  "libs/murmur-driver-env",
  "libs/murmur-driver-image",
  "libs/murmur-driver-stream",
  "libs/murmur-file-tools",
  "libs/murmur-hook-transcript",
  "libs/murmur-host-roots",
  "libs/murmur-test-parse",
  "libs/murmur-time",
  "libs/murmur-wasi-http",
  "tools/tool-corpus",
  "tools/tool-create",
  "tools/tool-edit",
  "tools/tool-find",
  "tools/tool-read",
  "tools/tool-write",
  "tools/tool-code-coverage",
  "tools/tool-code-graph",
  "tools/tool-git",
  "tools/tool-github",
  "tools/tool-test-report",
  "tools/tool-registry-search",
  "tools/tool-computer",
  "tools/tool-report",
  "tools/tool-request-input",
  "tools/tool-tavily",
  "tools/tool-browser",
  "tools/tool-git/validate",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.36.0"
license = "Apache-2.0"
# MSRV. At or below the toolchain pinned in rust-toolchain.toml (currently 1.95.0).
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.59"
# Dependencies that pull in C sources: SQLite via `bundled`, and tree-sitter's C
# runtime + grammars. Bundled SQLite compiles for wasm32-wasip2 with the pinned
# wasi-sdk (wasi-sdk.toml; tool-test-report links it as a component); the native
# tools that use these (tool-code-graph and others) are native until their ports.
rusqlite = { version = "0.31", features = ["bundled"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
sha2 = "0.10"
