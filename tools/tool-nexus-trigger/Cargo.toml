[package]
name = "tool-nexus-trigger"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
wit-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1.0.4"

# Host-target-only. wasmtime and wasmtime-wasi are used solely by tests/wasm_component.rs to
# instantiate the compiled wasm32-wasip2 component with a temp folder preopened as its inbox.
# tempfile gives the host tests their scratch inboxes, and serde_norway parses murmur.yaml in
# the manifest tests in src/lib.rs. Never a build-time dependency of the wasm target itself —
# a `[dev-dependencies]` entry is excluded from the cdylib the component is built from.
[dev-dependencies]
wasmtime = "46"
wasmtime-wasi = "46"
tempfile = "3"
serde_norway = "0.9.42"
