name: murmur-tool-editor
version: 0.5.0
runtime: tool
implementation: wasm
description: |
  Structured file editing interface for Murmur capsules. Provides read, write,
  surgical patch, and search operations without requiring shell capability grants.

  | op              | inputs                                         | outputs                                |
  |-----------------|------------------------------------------------|----------------------------------------|
  | read_file       | path, start_line?, end_line?                   | content: string, total_lines: int      |
  | write_file      | dest_path, content                             | (file created/updated)                 |
  | replace_in_file | dest_path, old_string, new_string              | count: N replacements                  |
  | find_in_files   | pattern, dir, recursive?, context_lines?       | matches: [{path, line, text}]          |

  read_file start_line/end_line are 1-based inclusive; both optional. Omitting both
  reads the whole file. A ranged read returns only that span plus total_lines and the
  resolved start_line/end_line. Ranges are capped (max 2000 lines); an oversized or
  inverted range errors rather than silently widening the read. read_file returns the
  requested content on every successful call, including a repeat read of an unchanged
  file, and writes nothing.

  find_in_files context_lines (default 0, like `grep -C`, max 20) attaches
  context_before/context_after arrays to each match; 0 omits those keys entirely.

  The two writing operations take their destination as dest_path; read_file and
  find_in_files take path and dir. dest_path is the only input this tool declares as a
  write destination, so a capsule's filesystem read_only grant is enforced against that
  declaration rather than against the spelling of a property name.

  All responses: {ok:bool, message:string, error_kind?:string}
  Paths are relative to the capsule workdir (the binary's CWD at dispatch time). An
  absolute value on path, dest_path or dir is refused rather than resolved: it returns
  error_kind absolute_path naming the offending value and the relative form to send, and
  the operation touches no file. Send 'results.txt', not '/app/results.txt'.

input_schema:
  type: object
  properties:
    operation:
      type: string
      enum:
        - read_file
        - write_file
        - replace_in_file
        - find_in_files
      description: "Operation to perform."
    path:
      type: string
      description: "File path to read, relative to capsule workdir; an absolute value is refused. Required for read_file."
    dest_path:
      type: string
      format: murmur-destination
      description: "File path this call writes to, relative to capsule workdir; an absolute value is refused. Required for write_file and replace_in_file."
    content:
      type: string
      description: "File content to write. Required for write_file."
    old_string:
      type: string
      description: "Literal string to search for. Required for replace_in_file."
    new_string:
      type: string
      description: "Replacement string. Required for replace_in_file."
    pattern:
      type: string
      description: "Regex pattern to search for. Required for find_in_files."
    dir:
      type: string
      description: "Directory to search in, relative to workdir; an absolute value is refused. Required for find_in_files."
    recursive:
      type: boolean
      description: "Whether to search recursively. Optional for find_in_files. Defaults to true."
    start_line:
      type: integer
      description: "1-based inclusive first line to read. Optional for read_file. Omit to read from the top."
    end_line:
      type: integer
      description: "1-based inclusive last line to read. Optional for read_file. Omit to read to EOF; clamps to the file's line count."
    context_lines:
      type: integer
      description: "Lines of context around each match (like grep -C). Optional for find_in_files. Defaults to 0 (no context); max 20."
  required:
    - operation

requires_files:
  - murmur_tool_editor.wasm
